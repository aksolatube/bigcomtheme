name: Build BigCommerce theme

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Create uploadable theme bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out theme source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install theme dependencies
        run: npm ci

      - name: Install Stencil CLI
        run: npm install --global @bigcommerce/stencil-cli@9.2.0

      - name: Build BigCommerce bundle
        run: stencil bundle

      - name: Upload theme ZIP
        uses: actions/upload-artifact@v4
        with:
          name: bigcommerce-theme-${{ github.sha }}
          path: "*.zip"
          if-no-files-found: error
          retention-days: 30
