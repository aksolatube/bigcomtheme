name: Build BigCommerce theme

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Create uploadable theme bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out theme source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Name this theme build
        id: theme
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "artifact_name=EXTRACT-FIRST-solatube-theme-v${version}-build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "bundle_name=UPLOAD-TO-BIGCOMMERCE-solatube-theme-v${version}-build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Install theme dependencies
        run: npm ci

      - name: Install Stencil CLI
        run: npm install --global @bigcommerce/stencil-cli@9.2.0

      - name: Build BigCommerce bundle
        run: stencil bundle --name "${{ steps.theme.outputs.bundle_name }}" --timeout 600

      - name: Upload theme ZIP
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.theme.outputs.artifact_name }}
          path: ${{ steps.theme.outputs.bundle_name }}.zip
          if-no-files-found: error
          retention-days: 30
