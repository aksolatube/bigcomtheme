<nav class="navUser">
    <ul class="navUser-section navUser-section--alt">
        <li class="navUser-item navUser-item--language">
            <div class="languageSelector languageSelector--desktop" data-language-selector>
                <details class="languageSelector-details">
                    <summary class="languageSelector-toggle" aria-label="Select language">
                        <svg class="languageSelector-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="9"></circle>
                            <path d="M3 12h18M12 3c2.7 2.5 4.1 5.5 4.1 9S14.7 18.5 12 21M12 3C9.3 5.5 7.9 8.5 7.9 12S9.3 18.5 12 21"></path>
                        </svg>
                        <span class="languageSelector-label">Language:</span>
                        <strong data-language-current>EN</strong>
                        <svg class="languageSelector-chevron" aria-hidden="true"><use xlink:href="#icon-chevron-down" /></svg>
                    </summary>
                    <div class="languageSelector-menu" role="menu" aria-label="Language">
                        <button type="button" role="menuitem" data-translate-language="en">English</button>
                        <button type="button" role="menuitem" data-translate-language="fr">Français</button>
                        <button type="button" role="menuitem" data-translate-language="nl">Nederlands</button>
                        <button type="button" role="menuitem" data-translate-language="es">Español</button>
                        <button type="button" role="menuitem" data-translate-language="de">Deutsch</button>
                    </div>
                </details>
            </div>
        </li>
        <li class="navUser-item navUser-item--account">
            <i class="icon" aria-hidden="true">
                <svg><use xlink:href="#icon-user" /></svg>
            </i>
            {{#if customer}}
                <a class="navUser-action" href="{{urls.account.index}}">{{lang 'common.account'}}</a> or
                <a class="navUser-action" href="{{urls.auth.logout}}">{{lang 'common.logout'}}</a>
            {{else}}
                <a class="navUser-action"
                   href="{{urls.auth.login}}"
                   aria-label="{{lang 'common.login'}}"
                >
                    {{lang 'common.login'}}
                </a>
                {{#if settings.account_creation_enabled}}
                    <span>{{lang 'common.or'}}</span> <a class="navUser-action" href="{{urls.auth.create_account}}">{{lang 'common.sign_up'}}</a>
                {{/if}}
            {{/if}}
        </li>
        {{> components/common/currency-selector}}
        <li class="navUser-item navUser-item--mobile-search">
            <i class="icon" aria-hidden="true">
                <svg><use xlink:href="#icon-search" /></svg>
            </i>
        </li>
        <li class="navUser-item navUser-item--cart">
            <a
                class="navUser-action"
                data-cart-preview
                data-dropdown="cart-preview-dropdown"
                data-options="align:right"
                href="{{urls.cart}}"
                aria-label="{{lang 'cart.nav_aria_label'}}"
            >
                <i class="icon" aria-hidden="true">
                    <svg><use xlink:href="#icon-cart" /></svg>
                </i>
                (<span class="{{#if cart.items}} countPill--positive{{/if}} cart-quantity">{{cart.quantity}}</span>)
            </a>

            <div class="dropdown-menu" id="cart-preview-dropdown" data-dropdown-content aria-hidden="true"></div>
        </li>
    </ul>
</nav>
